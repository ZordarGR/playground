<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="quarry-hill" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#7d5636"/>
      <stop offset="0.5" stop-color="#4a3421"/>
      <stop offset="1" stop-color="#241a11"/>
    </linearGradient>
    <linearGradient id="quarry-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9c7748"/>
      <stop offset="0.55" stop-color="#6b4a2f"/>
      <stop offset="1" stop-color="#4a3421"/>
    </linearGradient>
    <linearGradient id="quarry-wall1" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#4f3a25"/>
      <stop offset="0.6" stop-color="#2a2015"/>
      <stop offset="1" stop-color="#17130f"/>
    </linearGradient>
    <linearGradient id="quarry-floor1" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#6b4a2f"/>
      <stop offset="1" stop-color="#3a2b1c"/>
    </linearGradient>
    <linearGradient id="quarry-wall2" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#33261a"/>
      <stop offset="1" stop-color="#0d0b09"/>
    </linearGradient>
    <linearGradient id="quarry-floor2" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#443220"/>
      <stop offset="1" stop-color="#241b12"/>
    </linearGradient>
    <linearGradient id="quarry-timber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a5c38"/>
      <stop offset="1" stop-color="#402c1b"/>
    </linearGradient>
    <radialGradient id="quarry-pit" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#ffd76b"/>
      <stop offset="0.45" stop-color="#ff7847"/>
      <stop offset="0.8" stop-color="#57230f"/>
      <stop offset="1" stop-color="#17100b"/>
    </radialGradient>
    <radialGradient id="quarry-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb545" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#ff7847" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff7847" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ground contact shadow -->
  <ellipse cx="64" cy="113" rx="50" ry="8" fill="#000" opacity="0.35"/>

  <!-- hill mass -->
  <path d="M10 112 C14 80 17 52 27 33 C40 23 88 23 101 33 C111 52 114 80 118 112 Z"
        fill="url(#quarry-hill)" stroke="#0a0806" stroke-width="3" stroke-linejoin="round"/>

  <!-- flank light and shade facets -->
  <polygon points="16,108 21,62 31,37 35,41 27,66 23,108" fill="#ffb545" opacity="0.22"/>
  <polygon points="112,108 106,60 97,36 92,40 101,64 105,108" fill="#0a0806" opacity="0.3"/>

  <!-- strata bands on front face -->
  <path d="M22 72 Q64 64 106 72" fill="none" stroke="#9c8f7c" stroke-width="2.5" opacity="0.3"/>
  <path d="M17 90 Q64 82 111 90" fill="none" stroke="#9c8f7c" stroke-width="2.5" opacity="0.22"/>

  <!-- facet seams -->
  <path d="M46 57 L40 110" fill="none" stroke="#0a0806" stroke-width="1.5" stroke-opacity="0.4"/>
  <path d="M82 57 L90 110" fill="none" stroke="#0a0806" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- exposed vein on outer face -->
  <path d="M36 66 L43 74 L39 82 L47 92 L44 100" fill="none" stroke="#c9973f" stroke-width="3.2" stroke-linejoin="round" opacity="0.85"/>
  <path d="M36 66 L43 74 L39 82 L47 92 L44 100" fill="none" stroke="#ffd76b" stroke-width="1.4" stroke-linejoin="round" opacity="0.9"/>

  <!-- rim plateau -->
  <ellipse cx="64" cy="40" rx="40" ry="16" fill="url(#quarry-top)" stroke="#0a0806" stroke-width="3"/>

  <!-- bench 1 wall + floor -->
  <ellipse cx="64" cy="42" rx="35" ry="13.5" fill="url(#quarry-wall1)" stroke="#0a0806" stroke-width="2.5" stroke-opacity="0.9"/>
  <ellipse cx="64" cy="46" rx="29" ry="10" fill="url(#quarry-floor1)" stroke="#0a0806" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- bench 2 wall + floor -->
  <ellipse cx="64" cy="47.5" rx="23" ry="8" fill="url(#quarry-wall2)" stroke="#0a0806" stroke-width="1.5" stroke-opacity="0.5"/>
  <ellipse cx="64" cy="49.5" rx="17" ry="6" fill="url(#quarry-floor2)" stroke="#0a0806" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- bench 3 wall -->
  <ellipse cx="64" cy="51" rx="11" ry="4" fill="#17130f" stroke="#0a0806" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- glowing pit bottom -->
  <ellipse cx="64" cy="52" rx="14" ry="6" fill="url(#quarry-halo)"/>
  <ellipse cx="64" cy="52" rx="7" ry="2.8" fill="url(#quarry-pit)" stroke="#0a0806" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- ore veins striping the bench walls -->
  <path d="M42 34 L50 31 L58 33.5 L66 30.5 L75 33 L86 30" fill="none" stroke="#c9973f" stroke-width="3.2" stroke-linejoin="round" opacity="0.85"/>
  <path d="M42 34 L50 31 L58 33.5 L66 30.5 L75 33 L86 30" fill="none" stroke="#ffd76b" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M50 42.5 L58 40.5 L66 42.8 L76 40.5" fill="none" stroke="#ffb545" stroke-width="1.8" stroke-linejoin="round" opacity="0.95"/>
  <path d="M58 48.5 L64 47.4 L70 48.6" fill="none" stroke="#ffd76b" stroke-width="1.4" stroke-linejoin="round" opacity="0.9"/>

  <!-- lantern rim-light arcs, upper left -->
  <path d="M24.6 37.2 A 40 16 0 0 1 67.5 24.1" fill="none" stroke="#ffd76b" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  <path d="M36 43.4 A 29 10 0 0 1 69 36.2" fill="none" stroke="#ffb545" stroke-width="1.8" stroke-linecap="round" opacity="0.65"/>
  <path d="M47.5 48.2 A 17 6 0 0 1 67 43.6" fill="none" stroke="#ffb545" stroke-width="1.4" stroke-linecap="round" opacity="0.55"/>

  <!-- rope and bucket -->
  <path d="M58 22 L58 40" fill="none" stroke="#0a0806" stroke-width="1.3"/>
  <path d="M54.5 40 L61.5 40 L60 46 L56 46 Z" fill="#6e6a6a" stroke="#0a0806" stroke-width="2" stroke-linejoin="round"/>
  <path d="M55.5 41.3 L58.5 41.3" fill="none" stroke="#ffd76b" stroke-width="1" opacity="0.8"/>

  <!-- wooden rim crane -->
  <g stroke="#0a0806" stroke-width="2" stroke-linejoin="round">
    <rect x="30" y="31" width="13" height="4" rx="1" fill="#402c1b"/>
    <path d="M39 26 L54 18.5 L55 21 L40 28.5 Z" fill="#6b4a2f"/>
    <rect x="35" y="10" width="4.5" height="22" rx="1" fill="url(#quarry-timber)"/>
    <path d="M36 11 L58 17 L58 20.5 L36 15.5 Z" fill="url(#quarry-timber)"/>
    <circle cx="58" cy="19.5" r="2.6" fill="#c9973f"/>
  </g>
  <path d="M35.8 12 L35.8 30" fill="none" stroke="#ffb545" stroke-width="1" opacity="0.7"/>
  <path d="M37 11.6 L54 16.3" fill="none" stroke="#ffd76b" stroke-width="1" opacity="0.7"/>

  <!-- boulders at the base -->
  <g stroke="#0a0806" stroke-width="2.5" stroke-linejoin="round">
    <polygon points="22,109 27,99 36,100 39,109" fill="#484d54"/>
    <polygon points="94,109 98,101 107,103 109,109" fill="#211b15"/>
  </g>
  <polygon points="24,105 27.5,100 33,100.5 29,104" fill="#9aa0a8" opacity="0.8"/>
  <polygon points="96,106 98.5,102 103,103 100,105.5" fill="#6b4a2f" opacity="0.8"/>
</svg>
