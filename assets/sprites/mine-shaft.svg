<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="mine-shaft-rock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c241b"/>
      <stop offset="0.55" stop-color="#1b1611"/>
      <stop offset="1" stop-color="#0d0b09"/>
    </linearGradient>
    <linearGradient id="mine-shaft-void" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17130f"/>
      <stop offset="0.45" stop-color="#0a0806"/>
      <stop offset="1" stop-color="#040302"/>
    </linearGradient>
    <linearGradient id="mine-shaft-timber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a5f3c"/>
      <stop offset="0.5" stop-color="#6b4a2f"/>
      <stop offset="1" stop-color="#402c1b"/>
    </linearGradient>
    <linearGradient id="mine-shaft-lintel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#96693f"/>
      <stop offset="0.5" stop-color="#6b4a2f"/>
      <stop offset="1" stop-color="#402c1b"/>
    </linearGradient>
    <linearGradient id="mine-shaft-railfade" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#9aa0a8" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#6e6a6a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#484d54" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="mine-shaft-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd76b" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#ffb545" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ff7847" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mine-shaft-glass" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#fff3c0"/>
      <stop offset="0.55" stop-color="#ffd76b"/>
      <stop offset="1" stop-color="#ffb545"/>
    </radialGradient>
  </defs>

  <!-- ground contact shadow -->
  <ellipse cx="64" cy="113" rx="47" ry="7" fill="#000" opacity="0.35"/>

  <!-- rock face silhouette -->
  <path d="M10 111 L8 60 L23 33 L45 15 L85 13 L109 29 L120 58 L118 111 Z"
        fill="url(#mine-shaft-rock)" stroke="#0a0806" stroke-width="3" stroke-linejoin="round"/>

  <!-- rock facets -->
  <polygon points="23,33 45,15 54,25 33,44" fill="#3a2f21"/>
  <polygon points="8,60 23,33 33,44 20,66" fill="#2a2118"/>
  <polygon points="54,25 85,13 92,24 62,32" fill="#332a1e"/>
  <polygon points="92,24 109,29 118,54 100,44" fill="#211b15"/>
  <polygon points="100,44 118,54 118,86 104,74" fill="#17130f"/>
  <polygon points="10,90 20,66 28,80 12,104" fill="#17130f"/>
  <polygon points="96,80 112,92 110,111 98,111" fill="#0f0c0a"/>
  <!-- rim light on upper-left rock edges -->
  <path d="M23,33 L45,15 L60,14" fill="none" stroke="#ffd76b" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M9,61 L23,34" fill="none" stroke="#ffb545" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
  <path d="M33,44 L54,26" fill="none" stroke="#ffb545" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>

  <!-- pitch-dark opening -->
  <path d="M40 108 L46 48 L82 48 L88 108 Z"
        fill="url(#mine-shaft-void)" stroke="#0a0806" stroke-width="3" stroke-linejoin="round"/>

  <!-- faint rails vanishing inside -->
  <polygon points="48,108 53,108 63,68 61,68" fill="url(#mine-shaft-railfade)"/>
  <polygon points="75,108 80,108 67,68 65,68" fill="url(#mine-shaft-railfade)"/>
  <rect x="47" y="101" width="34" height="3.5" fill="url(#mine-shaft-railfade)" opacity="0.8"/>
  <rect x="52" y="88" width="25" height="3" fill="url(#mine-shaft-railfade)" opacity="0.6"/>
  <rect x="56" y="77" width="17" height="2.5" fill="url(#mine-shaft-railfade)" opacity="0.45"/>

  <!-- lantern glow inside the opening -->
  <circle cx="64" cy="66" r="24" fill="url(#mine-shaft-glow)"/>

  <!-- timber posts (A-frame, slanting inward) -->
  <polygon points="33,108 45,108 51,48 41,46"
           fill="url(#mine-shaft-timber)" stroke="#0a0806" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="83,108 95,108 87,46 77,48"
           fill="url(#mine-shaft-timber)" stroke="#0a0806" stroke-width="3" stroke-linejoin="round"/>
  <!-- post shading and grain -->
  <polygon points="43,108 45,108 51,48 48,47.5" fill="#2c1e12" opacity="0.8"/>
  <polygon points="92,108 95,108 87,46 84,46.6" fill="#2c1e12" opacity="0.8"/>
  <path d="M38,100 L43,60" fill="none" stroke="#402c1b" stroke-width="1.5" opacity="0.4"/>
  <path d="M89,98 L84,58" fill="none" stroke="#402c1b" stroke-width="1.5" opacity="0.4"/>
  <path d="M35,106 L41,50" fill="none" stroke="#ffb545" stroke-width="1.5" opacity="0.35"/>

  <!-- lintel beam -->
  <polygon points="30,38 98,38 96,52 32,52"
           fill="url(#mine-shaft-lintel)" stroke="#0a0806" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="32,48 96,48 96,52 32,52" fill="#2c1e12" opacity="0.75"/>
  <path d="M31,40 L97,40" fill="none" stroke="#ffd76b" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
  <path d="M36,44.5 L92,44.5" fill="none" stroke="#402c1b" stroke-width="1.5" opacity="0.4"/>
  <!-- brass bolt heads on lintel -->
  <circle cx="37" cy="45" r="2" fill="#c9973f" stroke="#0a0806" stroke-width="1.5"/>
  <circle cx="91" cy="45" r="2" fill="#c9973f" stroke="#0a0806" stroke-width="1.5"/>

  <!-- plank sign above (no readable text) -->
  <polygon points="41,18 87,15 88,28 42,31"
           fill="url(#mine-shaft-timber)" stroke="#0a0806" stroke-width="3" stroke-linejoin="round"/>
  <path d="M42,19.5 L86,16.6" fill="none" stroke="#ffd76b" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
  <polygon points="42,28 88,25 88,28 42,31" fill="#2c1e12" opacity="0.7"/>
  <!-- carved gouge marks standing in for lettering -->
  <path d="M48,22.5 L54,22.1 M58,21.8 L66,21.3 M70,21 L76,20.6 M80,20.3 L83,20.1"
        fill="none" stroke="#d8c9a8" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
  <circle cx="44.5" cy="24.5" r="1.6" fill="#c9973f" stroke="#0a0806" stroke-width="1.2"/>
  <circle cx="84.5" cy="21.8" r="1.6" fill="#c9973f" stroke="#0a0806" stroke-width="1.2"/>

  <!-- hanging iron lantern -->
  <path d="M64,52 L64,57" fill="none" stroke="#484d54" stroke-width="2"/>
  <circle cx="64" cy="55" r="1.6" fill="none" stroke="#6e6a6a" stroke-width="1.5"/>
  <polygon points="59,60 69,60 66.5,56.5 61.5,56.5" fill="#484d54" stroke="#0a0806" stroke-width="2" stroke-linejoin="round"/>
  <rect x="59" y="60" width="10" height="12" rx="2"
        fill="url(#mine-shaft-glass)" stroke="#0a0806" stroke-width="2.5"/>
  <path d="M61.5,60.5 L61.5,71.5 M66.5,60.5 L66.5,71.5" fill="none" stroke="#484d54" stroke-width="1.5" opacity="0.8"/>
  <circle cx="64" cy="66" r="2.2" fill="#fff6d0"/>
  <polygon points="60,72 68,72 66.5,75 61.5,75" fill="#484d54" stroke="#0a0806" stroke-width="2" stroke-linejoin="round"/>
  <path d="M60.2,61.5 L62.3,63.6" fill="none" stroke="#fff3c0" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>

  <!-- warm spill on ground before the entrance -->
  <ellipse cx="64" cy="107" rx="22" ry="4.5" fill="#ffb545" opacity="0.18"/>
  <!-- scattered gravel at threshold -->
  <polygon points="30,108 36,104 41,108" fill="#211b15" stroke="#0a0806" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="88,108 93,103 99,108" fill="#211b15" stroke="#0a0806" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="91,105 93.5,103.5 95,105.5" fill="#ffb545" opacity="0.3"/>
  <polygon points="33,106 36,104.5 38,106.5" fill="#9c8f7c" opacity="0.4"/>
</svg>
