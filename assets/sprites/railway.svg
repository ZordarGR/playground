<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="railway-boiler" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a4239"/>
      <stop offset="0.45" stop-color="#211b15"/>
      <stop offset="1" stop-color="#0d0b09"/>
    </linearGradient>
    <radialGradient id="railway-smokebox" cx="0.32" cy="0.3" r="0.95">
      <stop offset="0" stop-color="#57493a"/>
      <stop offset="0.45" stop-color="#241e17"/>
      <stop offset="1" stop-color="#0d0b09"/>
    </radialGradient>
    <linearGradient id="railway-brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd76b"/>
      <stop offset="0.5" stop-color="#c9973f"/>
      <stop offset="1" stop-color="#7a5a24"/>
    </linearGradient>
    <linearGradient id="railway-red" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ff5d73"/>
      <stop offset="0.55" stop-color="#c93a4e"/>
      <stop offset="1" stop-color="#7e2130"/>
    </linearGradient>
    <radialGradient id="railway-lamp" cx="0.4" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#fff6cf"/>
      <stop offset="0.5" stop-color="#ffd76b"/>
      <stop offset="0.85" stop-color="#ffb545"/>
      <stop offset="1" stop-color="#ff7847"/>
    </radialGradient>
    <radialGradient id="railway-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb545" stop-opacity="0.75"/>
      <stop offset="0.6" stop-color="#ffb545" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffb545" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="railway-steam" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#f4ead6"/>
      <stop offset="0.6" stop-color="#d8c9a8"/>
      <stop offset="1" stop-color="#9c8f7c"/>
    </radialGradient>
    <linearGradient id="railway-cab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b4a2f"/>
      <stop offset="0.6" stop-color="#513823"/>
      <stop offset="1" stop-color="#402c1b"/>
    </linearGradient>
    <linearGradient id="railway-coal" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#332a20"/>
      <stop offset="0.5" stop-color="#17130f"/>
      <stop offset="1" stop-color="#0d0b09"/>
    </linearGradient>
  </defs>

  <!-- steam puffs -->
  <g stroke="#0a0806" stroke-width="3" stroke-linejoin="round">
    <circle cx="46" cy="16" r="5.5" fill="url(#railway-steam)"/>
    <circle cx="77" cy="13" r="6.5" fill="url(#railway-steam)"/>
    <circle cx="66" cy="9" r="8" fill="url(#railway-steam)"/>
    <circle cx="54" cy="13" r="9" fill="url(#railway-steam)"/>
  </g>
  <path d="M48,7 Q52,4 57,6" fill="none" stroke="#f4ead6" stroke-width="2" stroke-linecap="round" opacity="0.9"/>

  <!-- ground shadow + rails -->
  <ellipse cx="64" cy="113" rx="51" ry="8" fill="#000" opacity="0.35"/>
  <path d="M16,119 L32,116" stroke="#402c1b" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <path d="M56,117 L72,114" stroke="#402c1b" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <path d="M96,114 L112,111" stroke="#402c1b" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <path d="M4,116 L124,107" stroke="#484d54" stroke-width="4" stroke-linecap="round"/>
  <path d="M4,115 L124,106" stroke="#9aa0a8" stroke-width="2" stroke-linecap="round"/>
  <path d="M10,110 L124,101" stroke="#484d54" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- ore wagon behind -->
  <g stroke="#0a0806" stroke-width="3" stroke-linejoin="round">
    <path d="M94,63 Q98,52 104,57 Q108,49 113,56 Q118,51 122,60 L122,66 L94,66 Z" fill="url(#railway-coal)"/>
    <rect x="93" y="62" width="30" height="32" rx="2" fill="url(#railway-cab)"/>
    <circle cx="108" cy="100" r="8" fill="#17130f"/>
  </g>
  <circle cx="108" cy="100" r="3" fill="url(#railway-brass)" stroke="#0a0806" stroke-width="1.5"/>
  <rect x="95" y="70" width="26" height="4" fill="#402c1b" stroke="#0a0806" stroke-width="1.5" opacity="0.9"/>
  <rect x="95" y="82" width="26" height="4" fill="#402c1b" stroke="#0a0806" stroke-width="1.5" opacity="0.9"/>
  <path d="M94,63 L100,60" stroke="#ffd76b" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <circle cx="103" cy="59" r="1.6" fill="#ffd76b"/>
  <circle cx="115" cy="57" r="1.4" fill="#ffb545"/>
  <path d="M108,53 L111,56 L108,59 L105,56 Z" fill="#b07cff" stroke="#0a0806" stroke-width="1"/>

  <!-- cab -->
  <g stroke="#0a0806" stroke-width="3" stroke-linejoin="round">
    <rect x="72" y="36" width="30" height="56" fill="url(#railway-cab)"/>
    <path d="M68,28 L106,28 L108,36 L66,36 Z" fill="#484d54"/>
    <rect x="78" y="43" width="18" height="16" rx="2" fill="url(#railway-lamp)"/>
  </g>
  <path d="M68,29 L88,29" stroke="#ffd76b" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <path d="M87,44 L87,58" stroke="#0a0806" stroke-width="1.5" opacity="0.4"/>
  <rect x="74" y="64" width="26" height="3" fill="#0a0806" opacity="0.35"/>

  <!-- frame + boiler -->
  <rect x="34" y="85" width="66" height="9" fill="#17130f" stroke="#0a0806" stroke-width="3" stroke-linejoin="round"/>
  <path d="M42,39 C58,36 70,35 78,36 L78,86 C70,87 58,88 42,89 Z" fill="url(#railway-boiler)" stroke="#0a0806" stroke-width="3" stroke-linejoin="round"/>
  <path d="M45,40 C58,37.5 69,36.7 76,37.2" fill="none" stroke="#ffd76b" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <rect x="55" y="37" width="4.5" height="51" fill="url(#railway-brass)" stroke="#0a0806" stroke-width="1.5" opacity="0.95"/>
  <rect x="67" y="36.4" width="4.5" height="50.5" fill="url(#railway-brass)" stroke="#0a0806" stroke-width="1.5" opacity="0.95"/>

  <!-- smokestack -->
  <g stroke="#0a0806" stroke-width="3" stroke-linejoin="round">
    <path d="M48,19 L60,19 L59.5,40 L48.5,40 Z" fill="url(#railway-boiler)"/>
    <path d="M43,8 L65,8 L61,19.5 L47,19.5 Z" fill="#211b15"/>
  </g>
  <rect x="47" y="20" width="14" height="4" fill="url(#railway-brass)" stroke="#0a0806" stroke-width="1.5"/>
  <path d="M45,9.5 L48.5,18" stroke="#ffd76b" stroke-width="2" stroke-linecap="round" opacity="0.85"/>

  <!-- wheels -->
  <circle cx="84" cy="98" r="11" fill="#17130f" stroke="#0a0806" stroke-width="3"/>
  <circle cx="84" cy="98" r="7" fill="#211b15" stroke="#9c8f7c" stroke-width="1.5" opacity="0.9"/>
  <circle cx="84" cy="98" r="3" fill="url(#railway-brass)" stroke="#0a0806" stroke-width="1.5"/>
  <circle cx="58" cy="98" r="13" fill="#17130f" stroke="#0a0806" stroke-width="3"/>
  <circle cx="58" cy="98" r="9" fill="#211b15" stroke="#9c8f7c" stroke-width="1.5" opacity="0.9"/>
  <path d="M58,90 L58,106 M50.5,95 L65.5,101 M50.5,101 L65.5,95" stroke="#9c8f7c" stroke-width="1.5" opacity="0.5"/>
  <circle cx="58" cy="98" r="3.5" fill="url(#railway-brass)" stroke="#0a0806" stroke-width="1.5"/>
  <path d="M49,89 A13,13 0 0 1 54,86" fill="none" stroke="#ffb545" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- cowcatcher -->
  <path d="M15,107 L34,79 L58,85 L48,107 Z" fill="url(#railway-red)" stroke="#0a0806" stroke-width="3" stroke-linejoin="round"/>
  <path d="M34,82 L26,105 M42,84 L36,105 M50,86 L44,105" stroke="#0a0806" stroke-width="1.5" opacity="0.35"/>
  <path d="M34,79.5 L56,85" stroke="#ffb545" stroke-width="2" stroke-linecap="round" opacity="0.85"/>

  <!-- smokebox front -->
  <circle cx="42" cy="64" r="25" fill="url(#railway-smokebox)" stroke="#0a0806" stroke-width="3"/>
  <circle cx="42" cy="64" r="17.5" fill="none" stroke="url(#railway-brass)" stroke-width="2.5" opacity="0.9"/>
  <circle cx="42" cy="64" r="11.5" fill="#211b15" stroke="#0a0806" stroke-width="2"/>
  <path d="M35,58 A9.5,9.5 0 0 1 44,54.6" fill="none" stroke="#c9973f" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <circle cx="42" cy="64" r="4" fill="url(#railway-brass)" stroke="#0a0806" stroke-width="1.5"/>
  <path d="M42,39.4 A24.6,24.6 0 0 0 17.6,60" fill="none" stroke="#ffd76b" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <circle cx="27" cy="50" r="1.6" fill="#ffd76b"/>
  <circle cx="23" cy="60" r="1.6" fill="#ffb545"/>
  <circle cx="42" cy="44.5" r="1.6" fill="#ffd76b"/>
  <circle cx="57" cy="52" r="1.5" fill="#9c8f7c" opacity="0.8"/>
  <circle cx="60" cy="66" r="1.5" fill="#9c8f7c" opacity="0.6"/>
  <circle cx="53" cy="80" r="1.5" fill="#6e6a6a" opacity="0.6"/>

  <!-- headlamp -->
  <circle cx="36" cy="32" r="15" fill="url(#railway-glow)"/>
  <rect x="27" y="24" width="18" height="16" rx="2" fill="url(#railway-boiler)" stroke="#0a0806" stroke-width="3" stroke-linejoin="round"/>
  <path d="M26,24 L46,24 L43.5,19 L28.5,19 Z" fill="url(#railway-brass)" stroke="#0a0806" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="36" cy="32" r="5.5" fill="url(#railway-lamp)" stroke="#0a0806" stroke-width="2"/>
  <circle cx="34.3" cy="30.3" r="1.5" fill="#fff6cf"/>
</svg>
