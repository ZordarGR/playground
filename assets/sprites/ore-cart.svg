<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="ore-cart-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd76b" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#ffb545" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffb545" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ore-cart-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a6038"/>
      <stop offset="0.5" stop-color="#6b4a2f"/>
      <stop offset="1" stop-color="#402c1b"/>
    </linearGradient>
    <linearGradient id="ore-cart-nugget" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffd76b"/>
      <stop offset="0.6" stop-color="#ffb545"/>
      <stop offset="1" stop-color="#ff7847"/>
    </linearGradient>
    <linearGradient id="ore-cart-iron" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9aa0a8"/>
      <stop offset="0.55" stop-color="#6e6a6a"/>
      <stop offset="1" stop-color="#484d54"/>
    </linearGradient>
    <linearGradient id="ore-cart-band" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#c9973f"/>
      <stop offset="0.6" stop-color="#8a6a34"/>
      <stop offset="1" stop-color="#5a4322"/>
    </linearGradient>
  </defs>

  <!-- ground contact shadow -->
  <ellipse cx="64" cy="112" rx="46" ry="8" fill="#000" opacity="0.35"/>

  <!-- upward light spill from the ore -->
  <ellipse cx="63" cy="42" rx="44" ry="30" fill="url(#ore-cart-glow)"/>

  <!-- rail track -->
  <g stroke="#0a0806" stroke-width="3" stroke-linejoin="round">
    <rect x="14" y="106" width="100" height="7" rx="2" fill="#211b15"/>
    <rect x="10" y="100" width="108" height="6" rx="2" fill="url(#ore-cart-iron)"/>
  </g>
  <rect x="12" y="101" width="102" height="2" fill="#9aa0a8" opacity="0.7"/>

  <!-- wheels -->
  <g stroke="#0a0806" stroke-width="3" stroke-linejoin="round">
    <circle cx="38" cy="94" r="13" fill="url(#ore-cart-iron)"/>
    <circle cx="90" cy="94" r="13" fill="url(#ore-cart-iron)"/>
  </g>
  <g fill="#17130f">
    <circle cx="38" cy="94" r="8"/>
    <circle cx="90" cy="94" r="8"/>
  </g>
  <!-- spokes -->
  <g stroke="#9aa0a8" stroke-width="2.2" stroke-linecap="round">
    <path d="M38 87v14M31 94h14M33.2 89.2l9.6 9.6M42.8 89.2l-9.6 9.6"/>
    <path d="M90 87v14M83 94h14M85.2 89.2l9.6 9.6M94.8 89.2l-9.6 9.6"/>
  </g>
  <g stroke="#0a0806" stroke-width="1.5" stroke-linejoin="round">
    <circle cx="38" cy="94" r="3.4" fill="#c9973f"/>
    <circle cx="90" cy="94" r="3.4" fill="#c9973f"/>
  </g>
  <!-- wheel rim light upper-left -->
  <path d="M28.5 88.5a11 11 0 0 1 8-5.4" fill="none" stroke="#ffd76b" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M80.5 88.5a11 11 0 0 1 8-5.4" fill="none" stroke="#ffd76b" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- cart body: trapezoid -->
  <path d="M22 52 L106 52 L96 96 L32 96 Z" fill="url(#ore-cart-body)" stroke="#0a0806" stroke-width="3" stroke-linejoin="round"/>

  <!-- plank seams + grain -->
  <g stroke="#0a0806" stroke-width="1.5" opacity="0.4" fill="none">
    <path d="M24.6 63 H103.4"/>
    <path d="M27.2 74 H100.8"/>
    <path d="M29.8 85 H98.2"/>
  </g>
  <g stroke="#402c1b" stroke-width="1.5" opacity="0.55" fill="none" stroke-linecap="round">
    <path d="M32 57c6 1 12-1 18 0"/>
    <path d="M62 58c7-1 13 1 20 0"/>
    <path d="M36 68c6-1 11 1 17 0"/>
    <path d="M68 69c6 1 12-1 18 0"/>
    <path d="M40 79c5 1 10-1 15 0"/>
    <path d="M64 80c6-1 11 1 16 0"/>
    <path d="M44 90c5-1 9 1 14 0"/>
  </g>
  <!-- warm rim light on body's upper-left edge -->
  <path d="M23.5 54.5 L58 54.5 L57.5 57.5 L24.5 57.5 Z" fill="#ffd76b" opacity="0.45"/>
  <path d="M25.8 56 L31.5 93.5 L34.5 93.5 L28.8 56 Z" fill="#c9973f" opacity="0.25"/>
  <!-- body shadow lower-right -->
  <path d="M96 96 L104.6 58 L98 58 L90 96 Z" fill="#0d0b09" opacity="0.35"/>

  <!-- iron banding: two diagonal straps -->
  <g stroke="#0a0806" stroke-width="1.8" stroke-linejoin="round">
    <path d="M40 52 L48 52 L38.4 96 L30.8 96 Z" fill="url(#ore-cart-band)"/>
    <path d="M82 52 L90 52 L84 96 L76.4 96 Z" fill="url(#ore-cart-band)"/>
  </g>
  <!-- rivets -->
  <g fill="#ffd76b">
    <circle cx="43" cy="58" r="1.6"/>
    <circle cx="41" cy="72" r="1.6" opacity="0.8"/>
    <circle cx="38.6" cy="86" r="1.6" opacity="0.6"/>
    <circle cx="85" cy="58" r="1.6"/>
    <circle cx="83.6" cy="72" r="1.6" opacity="0.8"/>
    <circle cx="81.8" cy="86" r="1.6" opacity="0.6"/>
  </g>

  <!-- top lip of cart -->
  <path d="M19 46 L109 46 L106 54 L22 54 Z" fill="#402c1b" stroke="#0a0806" stroke-width="3" stroke-linejoin="round"/>
  <path d="M20.5 47.5 L74 47.5 L73.5 49.8 L21.5 49.8 Z" fill="#ffb545" opacity="0.5"/>

  <!-- heaped ore behind the lip -->
  <g stroke="#0a0806" stroke-width="3" stroke-linejoin="round">
    <path d="M24 47 C30 38 36 34 44 36 C48 26 60 22 66 28 C72 20 84 22 87 31 C96 30 103 37 104 47 Z" fill="url(#ore-cart-nugget)"/>
  </g>
  <!-- ore facets: individual chunks -->
  <g stroke="#0a0806" stroke-width="1.5" stroke-opacity="0.4" stroke-linejoin="round">
    <path d="M44 36 L54 30 L62 36 L56 44 L46 44 Z" fill="#ffd76b"/>
    <path d="M62 36 L70 27 L80 32 L78 43 L66 45 Z" fill="#ffb545"/>
    <path d="M80 32 L90 34 L96 42 L88 46 L78 43 Z" fill="#ff7847"/>
    <path d="M30 42 L38 36 L46 44 L38 47 Z" fill="#ffb545"/>
    <path d="M56 44 L66 45 L62 47 L52 47 Z" fill="#ff7847" opacity="0.9"/>
  </g>
  <!-- hot highlights on upper-left facets -->
  <path d="M46 34 L54 29.6 L57 32 L49 36 Z" fill="#fff3c4" opacity="0.9"/>
  <path d="M64 30 L70 26.6 L73 29 L67 33 Z" fill="#fff3c4" opacity="0.85"/>
  <path d="M33 41 L38 37 L41 40 L36 43 Z" fill="#ffd76b" opacity="0.9"/>
  <path d="M82 33 L88 34.5 L86 37 L81 35.5 Z" fill="#ffd76b" opacity="0.7"/>

  <!-- spilled nugget on ground -->
  <path d="M107 100 L112 96 L117 100 L114 105 L108 104 Z" fill="url(#ore-cart-nugget)" stroke="#0a0806" stroke-width="3" stroke-linejoin="round"/>
  <path d="M108.6 99.4 L112 96.8 L114 98.6 L110.5 101 Z" fill="#fff3c4" opacity="0.85"/>

  <!-- rising sparks -->
  <g fill="#ffd76b">
    <circle cx="52" cy="18" r="1.8" opacity="0.9"/>
    <circle cx="76" cy="14" r="1.4" opacity="0.75"/>
    <circle cx="38" cy="26" r="1.3" opacity="0.6"/>
    <circle cx="92" cy="22" r="1.6" opacity="0.7"/>
    <circle cx="64" cy="10" r="1.2" opacity="0.55"/>
  </g>
</svg>
