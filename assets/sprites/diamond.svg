<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="diamond-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b07cff" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#b07cff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#b07cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="diamond-table" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6fbff"/>
      <stop offset="0.45" stop-color="#9cc8ff"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <linearGradient id="diamond-pav" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.6" stop-color="#4a5fd0"/>
      <stop offset="1" stop-color="#2b2560"/>
    </linearGradient>
    <linearGradient id="diamond-crownlite" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9e2ff"/>
    </linearGradient>
    <linearGradient id="diamond-pavdeep" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#8a6ae0"/>
      <stop offset="1" stop-color="#3a2a6e"/>
    </linearGradient>
  </defs>

  <!-- violet glow halo (floats, no ground shadow) -->
  <circle cx="64" cy="64" r="62" fill="url(#diamond-glow)"/>

  <!-- full silhouette base -->
  <path d="M14 56 L40 26 L88 26 L114 56 L90 61 L64 64 L38 61 Z M14 56 L38 61 L64 64 L90 61 L114 56 L64 112 Z"
        fill="url(#diamond-pav)"/>

  <!-- pavilion facets -->
  <path d="M14 56 L38 61 L64 112 Z" fill="#6db2ff"/>
  <path d="M38 61 L64 64 L64 112 Z" fill="url(#diamond-crownlite)" opacity="0.9"/>
  <path d="M64 64 L90 61 L64 112 Z" fill="url(#diamond-pav)"/>
  <path d="M90 61 L114 56 L64 112 Z" fill="url(#diamond-pavdeep)"/>
  <path d="M96 64 L114 56 L64 112 Z" fill="#241a4a" opacity="0.55"/>

  <!-- crown facets -->
  <path d="M14 56 L40 26 L31 39 Z" fill="url(#diamond-crownlite)"/>
  <path d="M14 56 L31 39 L46 47 L38 61 Z" fill="#bcd9ff"/>
  <path d="M38 61 L46 47 L64 47 L64 64 Z" fill="#8fc0ff"/>
  <path d="M64 64 L64 47 L82 47 L90 61 Z" fill="#7a8ce8"/>
  <path d="M88 26 L114 56 L97 39 Z" fill="#b07cff"/>
  <path d="M97 39 L114 56 L90 61 L82 47 Z" fill="#7e5cd0"/>

  <!-- table -->
  <path d="M40 26 L88 26 L97 39 L82 47 L46 47 L31 39 Z" fill="url(#diamond-table)"/>
  <!-- dark table reflections -->
  <path d="M52 30 L84 28 L92 38 L74 44 Z" fill="#233a72" opacity="0.75"/>
  <path d="M44 40 L66 33 L72 45 L50 46 Z" fill="#3d5bb0" opacity="0.6"/>
  <path d="M35 38 L46 31 L50 40 L44 44 Z" fill="#16224a" opacity="0.55"/>
  <!-- bright table streak -->
  <path d="M41 28 L58 27 L44 39 L34 37 Z" fill="#ffffff" opacity="0.85"/>

  <!-- interior facet seams -->
  <g fill="none" stroke="#0a0806" stroke-width="1.6" opacity="0.4" stroke-linejoin="round">
    <path d="M40 26 L31 39 L46 47 L38 61 M31 39 L14 56"/>
    <path d="M88 26 L97 39 L82 47 L90 61 M97 39 L114 56"/>
    <path d="M46 47 L64 47 L82 47 M64 47 L64 64"/>
    <path d="M38 61 L64 112 M64 64 L64 112 M90 61 L64 112"/>
  </g>
  <!-- girdle seam -->
  <path d="M14 56 L38 61 L64 64 L90 61 L114 56" fill="none" stroke="#0a0806" stroke-width="2" opacity="0.5" stroke-linejoin="round"/>

  <!-- amber lantern rim-light, upper left -->
  <path d="M14 56 L40 26 L44 28 L19 56 Z" fill="#ffd76b" opacity="0.85"/>
  <path d="M40 26 L58 26 L56 29 L44 28 Z" fill="#ffb545" opacity="0.7"/>
  <!-- cool rim on lower-left pavilion edge -->
  <path d="M14 56 L20 58 L66 106 L64 112 Z" fill="#eaf4ff" opacity="0.45"/>

  <!-- major silhouette outline -->
  <path d="M14 56 L40 26 L88 26 L114 56 L64 112 Z" fill="none" stroke="#0a0806" stroke-width="3" stroke-linejoin="round"/>

  <!-- sparkle stars at two corners -->
  <path d="M36 20 L38 26 L44 28 L38 30 L36 36 L34 30 L28 28 L34 26 Z" fill="#ffffff"/>
  <circle cx="36" cy="28" r="1.4" fill="#ffd76b"/>
  <path d="M106 66 L107.5 70.5 L112 72 L107.5 73.5 L106 78 L104.5 73.5 L100 72 L104.5 70.5 Z" fill="#ffffff"/>
  <circle cx="106" cy="72" r="1" fill="#b07cff"/>
  <!-- tiny glints -->
  <circle cx="64" cy="86" r="1.6" fill="#ffffff" opacity="0.9"/>
  <circle cx="90" cy="42" r="1.3" fill="#e8dcff" opacity="0.8"/>
</svg>
