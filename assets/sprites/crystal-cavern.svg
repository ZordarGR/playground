<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="crystal-cavern-rock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#352a1c"/>
      <stop offset="0.55" stop-color="#211b15"/>
      <stop offset="1" stop-color="#17130f"/>
    </linearGradient>
    <radialGradient id="crystal-cavern-glow" cx="0.5" cy="0.62" r="0.72">
      <stop offset="0" stop-color="#7b57cc"/>
      <stop offset="0.5" stop-color="#43307a"/>
      <stop offset="1" stop-color="#150f20"/>
    </radialGradient>
    <linearGradient id="crystal-cavern-amethyst" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#e6d0ff"/>
      <stop offset="0.55" stop-color="#a06ef8"/>
      <stop offset="1" stop-color="#8250e0"/>
    </linearGradient>
    <linearGradient id="crystal-cavern-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd76b"/>
      <stop offset="1" stop-color="#ffb545"/>
    </linearGradient>
  </defs>

  <!-- ground contact shadow -->
  <ellipse cx="64" cy="118" rx="48" ry="6" fill="#000" opacity="0.35"/>

  <!-- outer rock arch mass -->
  <path d="M14 116 L14 62 C14 30 34 14 64 13 C94 14 114 30 114 62 L114 116 Z"
        fill="url(#crystal-cavern-rock)" stroke="#0a0806" stroke-width="3" stroke-linejoin="round"/>

  <!-- rock facets -->
  <g stroke="#0a0806" stroke-width="1.5" stroke-opacity="0.4" stroke-linejoin="round">
    <polygon points="14,62 22,34 40,18 44,32 32,74" fill="#2e2419"/>
    <polygon points="40,18 64,13 88,18 80,31 64,30 44,32" fill="#241d15"/>
    <polygon points="88,18 106,34 114,62 96,74 80,31" fill="#17130f"/>
    <polygon points="114,62 114,116 96,116 96,74" fill="#120e0b"/>
    <polygon points="14,62 32,74 32,116 14,116" fill="#29211a"/>
    <polygon points="22,34 30,44 24,58 14,62" fill="#3a2d1d"/>
    <polygon points="96,88 114,84 114,102 96,104" fill="#0f0c09"/>
  </g>

  <!-- cave opening with violet ambient glow -->
  <path d="M32 116 L32 74 C32 44 46 31 64 30 C82 31 96 44 96 74 L96 116 Z"
        fill="url(#crystal-cavern-glow)" stroke="#0a0806" stroke-width="3" stroke-linejoin="round"/>

  <!-- cave floor -->
  <path d="M32 104 L96 104 L96 116 L32 116 Z" fill="#1a1322"/>
  <ellipse cx="64" cy="105.5" rx="27" ry="3.5" fill="#6b46b8" opacity="0.35"/>

  <!-- ceiling crystals -->
  <g stroke-linejoin="round">
    <polygon points="42,31 54,31 47,58" fill="#59389c" stroke="#0a0806" stroke-width="3"/>
    <polygon points="42,31 49,31 47,58" fill="#b07cff"/>
    <polygon points="46,34 49,33 47.5,46" fill="#e6d9ff" opacity="0.85"/>
    <polygon points="78,32 92,36 84,62" fill="#4e318a" stroke="#0a0806" stroke-width="3"/>
    <polygon points="78,32 86,33 84,62" fill="#9d6df2"/>
    <polygon points="82,36 85,36 84,48" fill="#d9c6ff" opacity="0.8"/>
  </g>

  <!-- floor crystal: back left -->
  <g stroke-linejoin="round">
    <polygon points="30,110 34,72 40,58 46,70 48,110" fill="#5c3aa0" stroke="#0a0806" stroke-width="3"/>
    <polygon points="30,110 34,72 40,58 40,110" fill="#8a5ce0"/>
    <polygon points="34,72 40,58 40,86 36,88" fill="#d4b3ff"/>
    <polygon points="38,62 40,58 41,66 39.5,68" fill="#f0e6ff" opacity="0.9"/>
  </g>

  <!-- floor crystal: right -->
  <g stroke-linejoin="round">
    <polygon points="80,112 82,76 90,62 98,80 100,112" fill="#4e318a" stroke="#0a0806" stroke-width="3"/>
    <polygon points="80,112 82,76 90,62 88,112" fill="#9d6df2"/>
    <polygon points="84,74 90,62 89,84 85,86" fill="#c9a6ff"/>
    <polygon points="88,66 90,62 91.5,70 89.5,72" fill="#f0e6ff" opacity="0.85"/>
  </g>

  <!-- main central crystal -->
  <g stroke-linejoin="round">
    <polygon points="52,112 52,68 64,44 76,64 78,112" fill="#7a4fd0" stroke="#0a0806" stroke-width="3"/>
    <polygon points="52,112 52,68 64,44 64,112" fill="url(#crystal-cavern-amethyst)"/>
    <polygon points="64,44 76,64 78,112 71,112 68,64" fill="#6b46b8"/>
    <polygon points="64,44 68,64 71,112 64,112" fill="#8f60ea"/>
    <polygon points="64,44 58,58 61,66 66,52" fill="#f0e6ff" opacity="0.95"/>
    <polygon points="53,74 56,70 55,100 53,102" fill="#e0ccff" opacity="0.5"/>
  </g>

  <!-- small front crystal -->
  <g stroke-linejoin="round">
    <polygon points="66,114 68,94 74,84 80,96 82,114" fill="#4e318a" stroke="#0a0806" stroke-width="3"/>
    <polygon points="66,114 68,94 74,84 73,114" fill="#b07cff"/>
    <polygon points="69,92 74,84 73,98 70,100" fill="#e0ccff" opacity="0.85"/>
  </g>

  <!-- violet rim light on cave mouth -->
  <path d="M34 100 L34 74 C34 47 47 33 64 32" fill="none" stroke="#b07cff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M94 98 L94 74 C94 56 88 42 76 35" fill="none" stroke="#7a4fd0" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

  <!-- warm lantern rim light, upper left -->
  <path d="M16 58 C18 34 34 18 56 14" fill="none" stroke="url(#crystal-cavern-rim)" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <path d="M20 46 C24 32 34 22 46 17" fill="none" stroke="#ffd76b" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <polygon points="16,66 22,62 22,78 16,80" fill="#ffb545" opacity="0.35"/>

  <!-- outline re-strike -->
  <path d="M14 116 L14 62 C14 30 34 14 64 13 C94 14 114 30 114 62 L114 116 Z"
        fill="none" stroke="#0a0806" stroke-width="3" stroke-linejoin="round"/>
</svg>
