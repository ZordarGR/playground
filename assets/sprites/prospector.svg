  <path d="M37 39 C46 35.5 55 34 64 34 C73 34 82 35.5 91 39 L92 44 C83 40 73 38 64 38 C55 38 45 40 36 44 Z" fill="#17130f" stroke="#0a0806" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- candle-lamp glow -->
  <circle cx="64" cy="24" r="15" fill="url(#prospector-glow)"/>

  <!-- lamp bracket + candle + flame -->
  <path d="M57 32 L71 32 L69 40 L59 40 Z" fill="url(#prospector-brass)" stroke="#0a0806" stroke-width="3" stroke-linejoin="round"/>
  <path d="M58 33 L63 33 L62.5 39 L59.5 39 Z" fill="#ecc069" opacity="0.7"/>
  <path d="M60.5 25 L67.5 25 L67 33 L61 33 Z" fill="#e8dcc8" stroke="#0a0806" stroke-width="2" stroke-linejoin="round"/>
  <path d="M61.2 26 L63.4 26 L63.1 32.4 L61.4 32.4 Z" fill="#fbf6ea" opacity="0.9"/>
  <path d="M64 15 C66.4 18 67.6 20.4 67.6 22.6 C67.6 25 66 26.4 64 26.4 C62 26.4 60.4 25 60.4 22.6 C60.4 20.4 61.6 18 64 15 Z" fill="url(#prospector-flame)" stroke="#0a0806" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M64 19 C65.2 20.6 65.7 21.8 65.7 22.9 C65.7 24.2 64.9 24.9 64 24.9 C63.1 24.9 62.3 24.2 62.3 22.9 C62.3 21.8 62.8 20.6 64 19 Z" fill="#fff3c4"/>
</svg>
