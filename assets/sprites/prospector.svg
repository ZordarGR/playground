  <path d="M52 70 C56 67 60 66.5 64 71 C68 66.5 72 67 76 70 C78 74 74 78 68 78 L60 78 C54 78 50 74 52 70 Z" fill="#e8dcc8" stroke="#0a0806" stroke-width="3" stroke-linejoin="round"/>
  <path d="M54 71 C57 69 60 68.8 63 71.5 L62 75 C58 75 55 73.5 54 71 Z" fill="#f7f0df" opacity="0.85"/>
  <path d="M74 71 C71 69 68 68.8 65 71.5 L66 75 C70 75 73 73.5 74 71 Z" fill="#b3a68f" opacity="0.6"/>

  <!-- hat brim -->
  <path d="M14 43 C24 36 44 33 64 33 C84 33 104 36 114 43 C116 46 114 50 110 50 C96 46 80 45 64 45 C48 45 32 46 18 50 C14 50 12 46 14 43 Z" fill="url(#prospector-brim)" stroke="#0a0806" stroke-width="3" stroke-linejoin="round"/>
  <path d="M16 43 C26 37.5 42 35 58 34.5 L57 38 C43 38.6 29 40.5 19 44.5 Z" fill="#ffd76b" opacity="0.4"/>
  <path d="M64 45 C80 45 96 46 110 50 C96 48 80 47.5 64 47.5 C48 47.5 32 48 18 50 C32 46 48 45 64 45 Z" fill="#17130f" opacity="0.55"/>

  <!-- hat crown -->
  <path d="M36 44 C34 30 40 16 52 13 C56 15 60 16 64 16 C68 16 72 15 76 13 C88 16 94 30 92 44 C83 40 73 38 64 38 C55 38 45 40 36 44 Z" fill="url(#prospector-hat)" stroke="#0a0806" stroke-width="3" stroke-linejoin="round"/>
  <path d="M38 42 C37 30 42 19 51 15.5 L54 17 C46 21 42 31 42 41 Z" fill="#ffb545" opacity="0.45"/>
  <path d="M64 16 C68 16 72 15 76 13 C80 14 83 17 86 21 C79 19 71 19.5 64 19.5 C60 19.5 56 19 52 13 C56 15 60 16 64 16 Z" fill="#2e1f12" opacity="0.5"/>
