<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="golden-nugget-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd76b" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#ffb545" stop-opacity="0.5"/>
      <stop offset="0.78" stop-color="#ff7847" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff7847" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="golden-nugget-core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe89a"/>
      <stop offset="0.55" stop-color="#ffd76b"/>
      <stop offset="1" stop-color="#e0a838"/>
    </linearGradient>
    <linearGradient id="golden-nugget-right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2c351"/>
      <stop offset="1" stop-color="#c9973f"/>
    </linearGradient>
    <linearGradient id="golden-nugget-under" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#c9973f"/>
      <stop offset="1" stop-color="#a07018"/>
    </linearGradient>
  </defs>

  <!-- amber glow halo (floats, no ground shadow) -->
  <circle cx="64" cy="64" r="62" fill="url(#golden-nugget-halo)"/>
  <circle cx="64" cy="63" r="46" fill="#ffb545" opacity="0.25"/>

  <!-- nugget silhouette -->
  <polygon points="40,26 66,22 88,32 104,52 106,74 94,96 68,106 44,100 26,84 22,58 30,38"
           fill="#c9973f" stroke="#0a0806" stroke-width="3" stroke-linejoin="round"/>

  <!-- facets: light upper-left to shadow lower-right -->
  <polygon points="40,26 66,22 56,50 30,38" fill="#fff3c4"/>
  <polygon points="66,22 88,32 78,58 56,50" fill="#ffd76b"/>
  <polygon points="88,32 104,52 106,74 78,58" fill="url(#golden-nugget-right)"/>
  <polygon points="30,38 56,50 52,76 26,84 22,58" fill="#f2c351"/>
  <polygon points="56,50 78,58 80,84 52,76" fill="url(#golden-nugget-core)"/>
  <polygon points="78,58 106,74 94,96 80,84" fill="#c9973f"/>
  <polygon points="52,76 80,84 94,96 68,106 44,100" fill="url(#golden-nugget-under)"/>
  <polygon points="26,84 52,76 44,100" fill="#b8842a"/>

  <!-- deepest shadow wedge lower-right -->
  <polygon points="94,96 68,106 80,84" fill="#8a5f12" opacity="0.8"/>

  <!-- interior facet seams -->
  <g fill="none" stroke="#0a0806" stroke-width="1.5" opacity="0.4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M30,38 L56,50 L66,22"/>
    <path d="M56,50 L78,58 L88,32"/>
    <path d="M78,58 L106,74"/>
    <path d="M78,58 L80,84 L94,96"/>
    <path d="M56,50 L52,76 L44,100"/>
    <path d="M52,76 L26,84"/>
    <path d="M52,76 L80,84"/>
  </g>

  <!-- warm rim light from upper left -->
  <path d="M26,84 L22,58 L30,38 L40,26 L66,22" fill="none" stroke="#fff3c4"
        stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/>
  <path d="M66,22 L88,32" fill="none" stroke="#ffd76b" stroke-width="2"
        stroke-linecap="round" opacity="0.6"/>

  <!-- hot highlight glints on top facet -->
  <polygon points="44,30 56,27 50,40 41,35" fill="#ffffff" opacity="0.75"/>
  <polygon points="60,55 70,58 68,70 58,66" fill="#fff3c4" opacity="0.5"/>

  <!-- four-pointed sparkle stars -->
  <g fill="#fffef5">
    <path d="M46,24 L48,32 L56,34 L48,36 L46,44 L44,36 L36,34 L44,32 Z"/>
    <path d="M95,44 L96.6,50 L102.5,51.5 L96.6,53 L95,59 L93.4,53 L87.5,51.5 L93.4,50 Z"/>
    <path d="M33,74 L34.2,78.3 L38.5,79.5 L34.2,80.7 L33,85 L31.8,80.7 L27.5,79.5 L31.8,78.3 Z"/>
    <path d="M82,95 L83.2,99.3 L87.5,100.5 L83.2,101.7 L82,106 L80.8,101.7 L76.5,100.5 L80.8,99.3 Z"/>
  </g>
</svg>
