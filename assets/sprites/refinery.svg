<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="refinery-vessel" x1="0" y1="0" x2="1" y2="0.9">
      <stop offset="0" stop-color="#f0b95c"/>
      <stop offset="0.35" stop-color="#c9973f"/>
      <stop offset="0.7" stop-color="#8a5a30"/>
      <stop offset="1" stop-color="#402c1b"/>
    </linearGradient>
    <linearGradient id="refinery-dome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd76b"/>
      <stop offset="0.5" stop-color="#d9a44a"/>
      <stop offset="1" stop-color="#6b4a2f"/>
    </linearGradient>
    <linearGradient id="refinery-pipeh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eab657"/>
      <stop offset="0.5" stop-color="#9a6b33"/>
      <stop offset="1" stop-color="#4d3420"/>
    </linearGradient>
    <linearGradient id="refinery-pipev" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eab657"/>
      <stop offset="0.55" stop-color="#9a6b33"/>
      <stop offset="1" stop-color="#4d3420"/>
    </linearGradient>
    <linearGradient id="refinery-iron" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9aa0a8"/>
      <stop offset="0.5" stop-color="#6e6a6a"/>
      <stop offset="1" stop-color="#484d54"/>
    </linearGradient>
    <radialGradient id="refinery-face" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#f4ead2"/>
      <stop offset="0.6" stop-color="#d8c9a8"/>
      <stop offset="1" stop-color="#b3a181"/>
    </radialGradient>
    <radialGradient id="refinery-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset="0.4" stop-color="#ffd76b" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff7847" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="refinery-ember" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd76b"/>
      <stop offset="0.55" stop-color="#ff7847" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ff7847" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ground contact shadow -->
  <ellipse cx="66" cy="115" rx="46" ry="6.5" fill="#000" opacity="0.35"/>

  <!-- base legs and firebox -->
  <path d="M34,92 L43,92 L40,112 L31,112 Z" fill="url(#refinery-iron)" stroke="#0a0806" stroke-width="3" stroke-linejoin="round"/>
  <path d="M69,92 L78,92 L81,112 L72,112 Z" fill="url(#refinery-iron)" stroke="#0a0806" stroke-width="3" stroke-linejoin="round"/>
  <path d="M45,112 V102 Q45,96 51,96 H61 Q67,96 67,102 V112 Z" fill="#0d0b09" stroke="#0a0806" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="56" cy="108" rx="9" ry="5.5" fill="url(#refinery-ember)"/>
  <circle cx="52" cy="109" r="2.2" fill="#ff7847"/>
  <circle cx="59" cy="110" r="1.8" fill="#ffb545"/>

  <!-- pipe run: horizontal from dome shoulder, elbow, vertical down to spout -->
  <path d="M66,27 H101 Q110,27 110,36 V74 H96 V41 Q96,39 94,39 H66 Z" fill="url(#refinery-pipeh)" stroke="#0a0806" stroke-width="3" stroke-linejoin="round"/>
  <path d="M96,46 V74 H110 V46 Z" fill="url(#refinery-pipev)"/>
  <path d="M96,46 V74 M110,46 V74" fill="none" stroke="#0a0806" stroke-width="1.5" opacity="0.4"/>
  <path d="M70,29.5 H98" fill="none" stroke="#ffd76b" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M98,45 V70" fill="none" stroke="#ffb545" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <rect x="93" y="43" width="20" height="5" rx="1.5" fill="#c9973f" stroke="#0a0806" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="97" cy="45.5" r="1.3" fill="#402c1b"/>
  <circle cx="109" cy="45.5" r="1.3" fill="#402c1b"/>
  <rect x="92" y="72" width="22" height="6" rx="2" fill="url(#refinery-pipeh)" stroke="#0a0806" stroke-width="3" stroke-linejoin="round"/>
  <path d="M98,78 L108,78 L105,86 L101,86 Z" fill="#6b4a2f" stroke="#0a0806" stroke-width="3" stroke-linejoin="round"/>

  <!-- retort vessel body -->
  <path d="M26,46 L86,46 L86,82 Q86,98 56,98 Q26,98 26,82 Z" fill="url(#refinery-vessel)" stroke="#0a0806" stroke-width="3" stroke-linejoin="round"/>
  <path d="M26,46 L40,46 L36,96 Q26,93 26,82 Z" fill="#ffd76b" opacity="0.28"/>
  <path d="M72,46 L86,46 L86,82 Q86,96 70,97.5 Z" fill="#0d0b09" opacity="0.3"/>
  <path d="M40,46 L37,95 M70,46 L70,97" fill="none" stroke="#0a0806" stroke-width="1.5" opacity="0.35"/>
  <path d="M28,52 V80" fill="none" stroke="#ffb545" stroke-width="2" stroke-linecap="round" opacity="0.55"/>

  <!-- mid brass band with rivets -->
  <rect x="26" y="62" width="60" height="8" fill="url(#refinery-pipeh)" stroke="#0a0806" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="31" cy="66" r="1.7" fill="#8a5a30" stroke="#0a0806" stroke-width="1"/>
  <circle cx="55" cy="66" r="1.7" fill="#8a5a30" stroke="#0a0806" stroke-width="1"/>
  <circle cx="67" cy="66" r="1.7" fill="#8a5a30" stroke="#0a0806" stroke-width="1"/>
  <circle cx="79" cy="66" r="1.7" fill="#8a5a30" stroke="#0a0806" stroke-width="1"/>

  <!-- dome over pipe start -->
  <path d="M28,46 Q30,20 56,18 Q82,20 84,46 Z" fill="url(#refinery-dome)" stroke="#0a0806" stroke-width="3" stroke-linejoin="round"/>
  <path d="M30,44 Q33,23 52,19.5 L46,44 Z" fill="#ffd76b" opacity="0.35"/>
  <path d="M63,19.5 Q80,23 82,44 L64,44 Z" fill="#0d0b09" opacity="0.28"/>
  <path d="M46,44 L52,20 M64,44 L62,20" fill="none" stroke="#0a0806" stroke-width="1.5" opacity="0.35"/>
  <path d="M32,40 Q34,25 52,20.5" fill="none" stroke="#ffd76b" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

  <!-- top valve wheel -->
  <rect x="52.5" y="10" width="7" height="9" fill="#c9973f" stroke="#0a0806" stroke-width="2" stroke-linejoin="round"/>
  <ellipse cx="56" cy="9" rx="7.5" ry="3.2" fill="#eab657" stroke="#0a0806" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M50.5,8 Q56,6.2 61.5,8" fill="none" stroke="#ffd76b" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>

  <!-- collar flange with rivets -->
  <rect x="23" y="42" width="66" height="7" rx="2.5" fill="url(#refinery-pipeh)" stroke="#0a0806" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="29" cy="45.5" r="1.7" fill="#8a5a30" stroke="#0a0806" stroke-width="1"/>
  <circle cx="60" cy="45.5" r="1.7" fill="#8a5a30" stroke="#0a0806" stroke-width="1"/>
  <circle cx="72" cy="45.5" r="1.7" fill="#8a5a30" stroke="#0a0806" stroke-width="1"/>
  <circle cx="84" cy="45.5" r="1.7" fill="#8a5a30" stroke="#0a0806" stroke-width="1"/>

  <!-- pressure gauge -->
  <circle cx="42" cy="57" r="12" fill="url(#refinery-dome)" stroke="#0a0806" stroke-width="3"/>
  <circle cx="42" cy="57" r="8.5" fill="url(#refinery-face)" stroke="#0a0806" stroke-width="1.5"/>
  <path d="M36.5,53 L38,54.5 M42,50 V52 M47.5,53 L46,54.5 M49,58 L47,58" fill="none" stroke="#17130f" stroke-width="1.3" stroke-linecap="round" opacity="0.75"/>
  <path d="M48.8,60.5 L47,60" fill="none" stroke="#ff5d73" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M42,57 L47.4,51.4" fill="none" stroke="#17130f" stroke-width="2" stroke-linecap="round"/>
  <circle cx="42" cy="57" r="2" fill="#c9973f" stroke="#0a0806" stroke-width="1"/>
  <path d="M34,51 Q36,48 39,47.5" fill="none" stroke="#ffd76b" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>

  <!-- glowing gold drip -->
  <circle cx="103" cy="94" r="10" fill="url(#refinery-glow)"/>
  <path d="M103,85 C99.8,90.5 99.3,94 103,96.8 C106.7,94 106.2,90.5 103,85 Z" fill="#ffd76b" stroke="#0a0806" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="101.8" cy="92.5" r="1.6" fill="#fff6d8"/>

  <!-- crucible with molten gold -->
  <path d="M93,104 H113 L110,114 Q103,117.5 96,114 Z" fill="url(#refinery-iron)" stroke="#0a0806" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="103" cy="104.5" rx="8.5" ry="2.6" fill="#ffb545" stroke="#0a0806" stroke-width="1.5"/>
  <ellipse cx="101.5" cy="104.2" rx="4" ry="1.2" fill="#fff6d8" opacity="0.9"/>
  <ellipse cx="103" cy="103" rx="9" ry="4" fill="url(#refinery-glow)" opacity="0.8"/>
  <path d="M95,106 L94,112" fill="none" stroke="#ffb545" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
</svg>
