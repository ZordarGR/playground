<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="coretap-crust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b241b"/>
      <stop offset="0.55" stop-color="#17130f"/>
      <stop offset="1" stop-color="#0d0b09"/>
    </linearGradient>
    <linearGradient id="coretap-surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8c9a8"/>
      <stop offset="0.6" stop-color="#9c8f7c"/>
      <stop offset="1" stop-color="#6e6a6a"/>
    </linearGradient>
    <linearGradient id="coretap-mantle1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a6240"/>
      <stop offset="0.5" stop-color="#6b4a2f"/>
      <stop offset="1" stop-color="#402c1b"/>
    </linearGradient>
    <radialGradient id="coretap-mantle2" gradientUnits="userSpaceOnUse" cx="64" cy="96" r="55">
      <stop offset="0" stop-color="#ff7847"/>
      <stop offset="0.4" stop-color="#a04a2a"/>
      <stop offset="0.75" stop-color="#5a3220"/>
      <stop offset="1" stop-color="#402c1b"/>
    </radialGradient>
    <radialGradient id="coretap-hot" gradientUnits="userSpaceOnUse" cx="64" cy="96" r="34">
      <stop offset="0" stop-color="#ffd76b"/>
      <stop offset="0.45" stop-color="#ff9a4d"/>
      <stop offset="1" stop-color="#c9502c"/>
    </radialGradient>
    <radialGradient id="coretap-core" gradientUnits="userSpaceOnUse" cx="60" cy="90" r="22">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.35" stop-color="#ffd76b"/>
      <stop offset="0.65" stop-color="#ffb545"/>
      <stop offset="1" stop-color="#ff7847"/>
    </radialGradient>
    <radialGradient id="coretap-glow" gradientUnits="userSpaceOnUse" cx="64" cy="94" r="38">
      <stop offset="0" stop-color="#ffb545" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#ff7847" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff7847" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coretap-pipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd76b"/>
      <stop offset="0.4" stop-color="#c9973f"/>
      <stop offset="1" stop-color="#6b4a2f"/>
    </linearGradient>
    <linearGradient id="coretap-flange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8c26a"/>
      <stop offset="0.5" stop-color="#c9973f"/>
      <stop offset="1" stop-color="#5a3d22"/>
    </linearGradient>
    <clipPath id="coretap-wedge">
      <path d="M18.2 39.5 A84 84 0 0 1 109.8 39.5 L64 110 Z"/>
    </clipPath>
  </defs>

  <!-- ground contact shadow -->
  <ellipse cx="64" cy="117.5" rx="36" ry="6" fill="#000" opacity="0.35"/>

  <!-- crust wedge (outer silhouette) -->
  <path d="M18.2 39.5 A84 84 0 0 1 109.8 39.5 L64 110 Z" fill="url(#coretap-crust)" stroke="#0a0806" stroke-width="3" stroke-linejoin="round"/>

  <!-- surface regolith band -->
  <path d="M18.2 39.5 A84 84 0 0 1 109.8 39.5 L106.5 44.6 A78 78 0 0 0 21.5 44.6 Z" fill="url(#coretap-surface)" stroke="#0a0806" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- upper mantle wedge -->
  <path d="M25.8 51.3 A70 70 0 0 1 102.2 51.3 L64 110 Z" fill="url(#coretap-mantle1)"/>
  <!-- lower mantle wedge (warmed by core) -->
  <path d="M36.7 68.1 A50 50 0 0 1 91.3 68.1 L64 110 Z" fill="url(#coretap-mantle2)"/>
  <!-- hot inner layer -->
  <path d="M47.6 84.8 A30 30 0 0 1 80.4 84.8 L64 110 Z" fill="url(#coretap-hot)"/>

  <!-- facet seams: concentric -->
  <path d="M25.8 51.3 A70 70 0 0 1 102.2 51.3" fill="none" stroke="#0a0806" stroke-width="2" stroke-opacity="0.4"/>
  <path d="M31.3 59.7 A60 60 0 0 1 96.7 59.7" fill="none" stroke="#0a0806" stroke-width="1.5" stroke-opacity="0.35"/>
  <path d="M36.7 68.1 A50 50 0 0 1 91.3 68.1" fill="none" stroke="#0a0806" stroke-width="2" stroke-opacity="0.4"/>
  <path d="M42.2 76.4 A40 40 0 0 1 85.8 76.4" fill="none" stroke="#0a0806" stroke-width="1.5" stroke-opacity="0.3"/>
  <path d="M47.6 84.8 A30 30 0 0 1 80.4 84.8" fill="none" stroke="#0a0806" stroke-width="2" stroke-opacity="0.45"/>
  <!-- facet seams: radial -->
  <path d="M55.7 81.2 L40.8 29.3" fill="none" stroke="#0a0806" stroke-width="1.5" stroke-opacity="0.3"/>
  <path d="M72.3 81.2 L87.2 29.3" fill="none" stroke="#0a0806" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- rock chunks in crust -->
  <path d="M30 44 L36 42 L38 47 L31 49 Z" fill="#484d54"/>
  <path d="M88 46 L95 45 L97 50 L90 52 Z" fill="#17130f"/>
  <path d="M44 50 L49 48 L51 53 L45 55 Z" fill="#211b15"/>
  <!-- gold flecks in mantle -->
  <circle cx="40" cy="61" r="1.8" fill="#ffd76b"/>
  <circle cx="86" cy="63" r="1.5" fill="#ffb545"/>
  <circle cx="79" cy="57" r="1.2" fill="#ffd76b"/>

  <!-- core glow radiating through layers -->
  <g clip-path="url(#coretap-wedge)">
    <circle cx="64" cy="94" r="38" fill="url(#coretap-glow)"/>
  </g>

  <!-- molten core -->
  <circle cx="64" cy="94" r="16" fill="url(#coretap-core)" stroke="#0a0806" stroke-width="3"/>
  <path d="M53 87 A13 13 0 0 1 63 80.5" fill="none" stroke="#fff3c4" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>

  <!-- glowing cracks -->
  <path d="M54 84 L50 76 L53 69" fill="none" stroke="#ff7847" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <path d="M54 84 L50 76 L53 69" fill="none" stroke="#ffd76b" stroke-width="0.8" stroke-linecap="round" opacity="0.8"/>
  <path d="M75 83 L80 75 L78 68" fill="none" stroke="#ff7847" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <path d="M75 83 L80 75 L78 68" fill="none" stroke="#ffd76b" stroke-width="0.8" stroke-linecap="round" opacity="0.8"/>

  <!-- amber rim light, upper-left edge -->
  <path d="M22 37.3 A84 84 0 0 1 64 26" fill="none" stroke="#ffd76b" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  <path d="M19.5 41.5 L44 79" fill="none" stroke="#ffb545" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>

  <!-- riveted brass pipe -->
  <rect x="59.5" y="20" width="9" height="78" rx="1.5" fill="url(#coretap-pipe)" stroke="#0a0806" stroke-width="3" stroke-linejoin="round"/>
  <line x1="61.8" y1="25" x2="61.8" y2="93" stroke="#ffd76b" stroke-width="1.5" opacity="0.55"/>
  <!-- pipe entering core: heat bloom -->
  <ellipse cx="64" cy="95" rx="7" ry="4" fill="#fff3c4" opacity="0.55"/>

  <!-- surface collar flange -->
  <rect x="55.5" y="23" width="17" height="6" rx="1.5" fill="url(#coretap-flange)" stroke="#0a0806" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="58.8" cy="26" r="1.3" fill="#ffd76b"/>
  <circle cx="69.2" cy="26" r="1.3" fill="#6b4a2f"/>

  <!-- coupling flanges with rivets -->
  <rect x="56.5" y="40" width="15" height="5" rx="1.2" fill="url(#coretap-flange)" stroke="#0a0806" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="59.3" cy="42.5" r="1.1" fill="#ffd76b"/>
  <circle cx="68.7" cy="42.5" r="1.1" fill="#5a3d22"/>
  <rect x="56.5" y="60" width="15" height="5" rx="1.2" fill="url(#coretap-flange)" stroke="#0a0806" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="59.3" cy="62.5" r="1.1" fill="#ffd76b"/>
  <circle cx="68.7" cy="62.5" r="1.1" fill="#5a3d22"/>
  <rect x="56.5" y="79" width="15" height="5" rx="1.2" fill="url(#coretap-flange)" stroke="#0a0806" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="59.3" cy="81.5" r="1.1" fill="#ffd76b"/>
  <circle cx="68.7" cy="81.5" r="1.1" fill="#5a3d22"/>

  <!-- valve stem and hand wheel -->
  <rect x="61.5" y="12" width="5" height="11" rx="1" fill="#9aa0a8" stroke="#0a0806" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="64" y1="12" x2="64" y2="16.5" stroke="#484d54" stroke-width="1.5" opacity="0.6"/>
  <line x1="52" y1="11.5" x2="76" y2="11.5" stroke="#8a6a33" stroke-width="2"/>
  <ellipse cx="64" cy="11.5" rx="13" ry="4.8" fill="none" stroke="#0a0806" stroke-width="6.5" stroke-linejoin="round"/>
  <ellipse cx="64" cy="11.5" rx="13" ry="4.8" fill="none" stroke="#c9973f" stroke-width="3.5"/>
  <path d="M52.5 10 A13 4.8 0 0 1 63 6.7" fill="none" stroke="#ffd76b" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="64" cy="11.5" r="2.6" fill="#ffd76b" stroke="#0a0806" stroke-width="1.5"/>

  <!-- crisp outer silhouette re-stroke -->
  <path d="M18.2 39.5 A84 84 0 0 1 109.8 39.5 L64 110 Z" fill="none" stroke="#0a0806" stroke-width="3" stroke-linejoin="round"/>
</svg>
