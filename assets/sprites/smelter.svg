<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="smelter-brick" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#33281c"/>
      <stop offset="0.5" stop-color="#1b1510"/>
      <stop offset="1" stop-color="#0d0b09"/>
    </linearGradient>
    <linearGradient id="smelter-chimney" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2e251a"/>
      <stop offset="0.55" stop-color="#17130f"/>
      <stop offset="1" stop-color="#0d0b09"/>
    </linearGradient>
    <radialGradient id="smelter-glow" cx="0.5" cy="0.8" r="0.85">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="0.35" stop-color="#ffd76b"/>
      <stop offset="0.68" stop-color="#ff7847"/>
      <stop offset="1" stop-color="#8f2d10"/>
    </radialGradient>
    <linearGradient id="smelter-molten" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="0.55" stop-color="#ffd76b"/>
      <stop offset="1" stop-color="#ffb545"/>
    </linearGradient>
    <linearGradient id="smelter-brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd76b"/>
      <stop offset="0.45" stop-color="#c9973f"/>
      <stop offset="1" stop-color="#6e4d1e"/>
    </linearGradient>
    <radialGradient id="smelter-smoke" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#b0a48f" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#9c8f7c" stop-opacity="0.15"/>
    </radialGradient>
  </defs>

  <!-- ground contact shadow -->
  <ellipse cx="64" cy="117" rx="46" ry="7.5" fill="#000" opacity="0.35"/>

  <!-- smoke puffs -->
  <circle cx="83" cy="13" r="4.2" fill="url(#smelter-smoke)"/>
  <circle cx="74" cy="9" r="5.6" fill="url(#smelter-smoke)"/>
  <circle cx="64" cy="13" r="7" fill="url(#smelter-smoke)"/>
  <circle cx="61" cy="10" r="3" fill="#e8dcc8" opacity="0.35"/>
  <circle cx="71" cy="6" r="2.4" fill="#e8dcc8" opacity="0.3"/>

  <!-- chimney -->
  <rect x="66" y="18" width="20" height="42" fill="url(#smelter-chimney)" stroke="#0a0806" stroke-width="3" stroke-linejoin="round"/>
  <line x1="67" y1="30" x2="85" y2="30" stroke="#0a0806" stroke-width="1.5" opacity="0.4"/>
  <line x1="67" y1="41" x2="85" y2="41" stroke="#0a0806" stroke-width="1.5" opacity="0.4"/>
  <line x1="67" y1="52" x2="85" y2="52" stroke="#0a0806" stroke-width="1.5" opacity="0.4"/>
  <rect x="67.6" y="20" width="2.6" height="38" fill="#ffb545" opacity="0.35"/>
  <rect x="62" y="12" width="28" height="8" rx="2" fill="#211b15" stroke="#0a0806" stroke-width="3" stroke-linejoin="round"/>
  <rect x="63.5" y="13.5" width="10" height="2.4" rx="1.2" fill="#ffd76b" opacity="0.45"/>

  <!-- furnace body -->
  <path d="M20 112 L28 58 L100 58 L108 112 Z" fill="url(#smelter-brick)" stroke="#0a0806" stroke-width="3" stroke-linejoin="round"/>
  <!-- brick facets -->
  <rect x="33" y="63" width="15" height="6" rx="1" fill="#2a2117" stroke="#0a0806" stroke-width="1.5" opacity="0.85"/>
  <rect x="52" y="63" width="15" height="6" rx="1" fill="#241c13" stroke="#0a0806" stroke-width="1.5" opacity="0.7"/>
  <rect x="71" y="63" width="15" height="6" rx="1" fill="#17130f" stroke="#0a0806" stroke-width="1.5" opacity="0.7"/>
  <rect x="27" y="84" width="14" height="6" rx="1" fill="#2a2117" stroke="#0a0806" stroke-width="1.5" opacity="0.75"/>
  <rect x="26" y="94" width="12" height="6" rx="1" fill="#1d1712" stroke="#0a0806" stroke-width="1.5" opacity="0.6"/>
  <rect x="86" y="84" width="13" height="6" rx="1" fill="#0d0b09" stroke="#0a0806" stroke-width="1.5" opacity="0.6"/>
  <rect x="88" y="94" width="13" height="6" rx="1" fill="#0d0b09" stroke="#0a0806" stroke-width="1.5" opacity="0.6"/>
  <!-- upper-left rim light on body -->
  <path d="M28 58 L34 58 L26.6 108 L23 108 Z" fill="#ffb545" opacity="0.35"/>
  <!-- lower-right shadow -->
  <path d="M100 58 L108 112 L96 112 L92 58 Z" fill="#000" opacity="0.3"/>

  <!-- top ledge -->
  <rect x="22" y="52" width="84" height="9" rx="2.5" fill="#211b15" stroke="#0a0806" stroke-width="3" stroke-linejoin="round"/>
  <rect x="25" y="53.8" width="30" height="2.6" rx="1.3" fill="#ffd76b" opacity="0.4"/>

  <!-- brass rivet band -->
  <path d="M26.3 70 L101.7 70 L103 79 L25 79 Z" fill="url(#smelter-brass)" stroke="#0a0806" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="33" cy="74.5" r="1.8" fill="#6e4d1e"/>
  <circle cx="32.4" cy="73.9" r="0.9" fill="#ffd76b"/>
  <circle cx="49" cy="74.5" r="1.8" fill="#6e4d1e"/>
  <circle cx="48.4" cy="73.9" r="0.9" fill="#ffd76b"/>
  <circle cx="64" cy="74.5" r="1.8" fill="#6e4d1e"/>
  <circle cx="63.4" cy="73.9" r="0.9" fill="#ffd76b"/>
  <circle cx="79" cy="74.5" r="1.8" fill="#6e4d1e"/>
  <circle cx="78.4" cy="73.9" r="0.9" fill="#ffd76b"/>
  <circle cx="95" cy="74.5" r="1.8" fill="#6e4d1e"/>
  <circle cx="94.4" cy="73.9" r="0.9" fill="#ffd76b"/>

  <!-- hearth mouth: frame then glow -->
  <path d="M43 110 L43 92 Q43 76 63 76 Q83 76 83 92 L83 110 Z" fill="#0d0b09" stroke="#0a0806" stroke-width="3" stroke-linejoin="round"/>
  <path d="M47 108 L47 93 Q47 81 63 81 Q79 81 79 93 L79 108 Z" fill="url(#smelter-glow)"/>
  <ellipse cx="63" cy="105" rx="13" ry="3.6" fill="#ffe9a8" opacity="0.9"/>
  <!-- coals in the hearth -->
  <circle cx="55" cy="101" r="2.6" fill="#ff7847" opacity="0.9"/>
  <circle cx="70" cy="100" r="2.2" fill="#ffb545" opacity="0.9"/>
  <circle cx="63" cy="96" r="1.8" fill="#ffe9a8" opacity="0.8"/>
  <!-- sparks -->
  <circle cx="50" cy="86" r="1.2" fill="#ffd76b"/>
  <circle cx="74" cy="89" r="1" fill="#ff7847"/>

  <!-- molten pour stream -->
  <path d="M55 104 Q52.5 109 52.5 114 L60.5 114 Q59.5 108.5 61 104 Z" fill="url(#smelter-molten)" stroke="#0a0806" stroke-width="1.5" stroke-linejoin="round" opacity="0.97"/>
  <path d="M57.5 105 Q56 109 56 113 L58 113 Q57.5 108.5 59 105 Z" fill="#ffe9a8"/>

  <!-- mold catching the pour -->
  <rect x="42" y="110" width="30" height="10" rx="2" fill="#484d54" stroke="#0a0806" stroke-width="3" stroke-linejoin="round"/>
  <rect x="45.5" y="112" width="23" height="5" rx="1.5" fill="#211b15"/>
  <rect x="46.5" y="112.6" width="21" height="3.8" rx="1.4" fill="url(#smelter-molten)"/>
  <rect x="44" y="110.8" width="9" height="1.8" rx="0.9" fill="#9aa0a8" opacity="0.8"/>
  <ellipse cx="57" cy="120" rx="16" ry="2.6" fill="#ff7847" opacity="0.3"/>
</svg>
